name: PhishingGuard CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  api-tests:
    name: Automated API, Adversarial & RAG Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with Git LFS for model bundle)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            Api/requirements.txt
            Api/requirements-dev.txt

      - name: Install system dependency for LightGBM
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r Api/requirements.txt -r Api/requirements-dev.txt

      - name: Run automated pytest suite
        run: pytest -v Api/tests/test_phishing_api.py

  build-extension-artifact:
    name: Package Chrome Extension ZIP
    runs-on: ubuntu-latest
    needs: api-tests
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip Extension folder
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('Extension/manifest.json'))['version'])")
          cd Extension && zip -r "../PhishingGuard-Extension-v${VERSION}.zip" .
          echo "EXT_ZIP=PhishingGuard-Extension-v${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Upload Extension ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: phishingguard-extension
          path: ${{ env.EXT_ZIP }}

  deploy-api:
    name: Build & Push Docker Hub + Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: api-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout repository (with Git LFS for model bundle)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Docker Hub credentials
        id: creds
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "docker_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker_ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Docker Hub push: set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Secrets."
          fi
          if [ -n "$RENDER_HOOK" ]; then
            echo "render_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "render_ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Render trigger: set RENDER_DEPLOY_HOOK_URL in repository Secrets."
          fi

      - name: Set up Docker Buildx
        if: steps.creds.outputs.docker_ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.docker_ready == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.creds.outputs.docker_ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./Api
          file: ./Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/phishingguard-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/phishingguard-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy Hook
        if: steps.creds.outputs.render_ready == 'true'
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$RENDER_HOOK"
          echo "Triggered Render auto-deploy successfully."
